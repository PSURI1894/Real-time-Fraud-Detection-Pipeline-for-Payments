syntax = "proto3";
package payments.fraud;

option go_package = "github.com/payments/fraud/proto";

import "proto/transaction.proto";

message FraudRequest {
  TransactionEvent event = 1;
}

message FraudDecision {
  string decision = 1;
  double score = 2;
}

service FraudService {
  rpc CheckTransaction(FraudRequest) returns (FraudDecision);
}
